    }catch(_e){}</script><meta charset="utf-8"></head><body class="bg-[#F9F8F6] text-on-background font-body-md selection:bg-primary-fixed selection:text-on-primary-fixed">

<span class="material-symbols-outlined text-[18px]">logout</span>
Disconnect
</button>

<!-- Main Content Area -->
<main class="ml-64 flex-1 flex flex-col pt-6 px-8 pb-12 gap-8 max-w-[1600px]">
<div class="flex justify-between items-end">
<div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Payments</h1>
<p class="text-on-surface-variant mt-1" id="paySubtitle">Connect your backend to review payment screenshots.</p>

<!-- Backend Connection Bar -->
<div class="bg-white p-4 rounded-2xl border border-surface-border shadow-sm flex flex-col md:flex-row md:items-center gap-3">
<div class="flex items-center gap-2 text-on-surface-variant shrink-0">

<span class="font-label-md font-bold">Backend</span>

</div>
<input id="apiUrlInput" type="text" placeholder="https://nativachatbot-production.up.railway.app" class="flex-1 px-4 py-2 bg-surface-container-low border-none rounded-full text-sm focus:ring-2 focus:ring-primary/20 transition-all">
<input id="adminKeyInput" type="password" placeholder="Admin key (if set)" class="w-40 px-4 py-2 bg-surface-container-low border-none rounded-full text-sm focus:ring-2 focus:ring-primary/20 transition-all">

</div>

<!-- Status filter tabs -->
<div class="flex items-center gap-2 bg-white p-1 rounded-xl border border-surface-border shadow-sm w-fit">
<button class="filter-tab px-4 py-2 rounded-lg font-label-md bg-secondary-container text-on-secondary-container" data-status="">All</button>
<button class="filter-tab px-4 py-2 rounded-lg font-label-md text-on-surface-variant hover:bg-surface-container transition-colors" data-status="submitted">Awaiting review</button>
<button class="filter-tab px-4 py-2 rounded-lg font-label-md text-on-surface-variant hover:bg-surface-container transition-colors" data-status="pending_proof">Awaiting patient</button>
<button class="filter-tab px-4 py-2 rounded-lg font-label-md text-on-surface-variant hover:bg-surface-container transition-colors" data-status="approved">Approved</button>
<button class="filter-tab px-4 py-2 rounded-lg font-label-md text-on-surface-variant hover:bg-surface-container transition-colors" data-status="rejected">Rejected</button>
</div>
<!-- Invoice cards -->
<div id="invoiceList" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
<p class="text-label-sm text-on-surface-variant">Connect a backend to load invoices.</p>
</div>
</main>
</div>
<!-- Screenshot lightbox -->
<div id="lightbox" class="fixed inset-0 bg-black/70 z-[100] hidden items-center justify-center p-8" onclick="closeLightbox(event)">
<img id="lightboxImg" src="" class="max-h-[85vh] max-w-[90vw] rounded-xl shadow-2xl" alt="Payment screenshot">
</div>

<script>
    let apiBaseUrl = '';
    let adminKey = '';
    let invoices = [];
    let activeFilter = '';

    async function loadState(){
        try{ apiBaseUrl = localStorage.getItem('nativacareApiBaseUrl') || ''; }catch(e){ apiBaseUrl = ''; }
        if(!apiBaseUrl && /^https?:$/.test(window.location.protocol)){
            apiBaseUrl = window.location.origin; // auto-connect when dashboard is served by the same backend
        }
        document.getElementById('apiUrlInput').value = apiBaseUrl;
        try{ adminKey = localStorage.getItem('nativacareAdminKey') || ''; }catch(e){ adminKey = ''; }
        document.getElementById('adminKeyInput').value = adminKey;
    }
    async function saveApiUrl(){ try{ localStorage.setItem('nativacareApiBaseUrl', apiBaseUrl); }catch(e){} }
    async function saveAdminKey(){ try{ localStorage.setItem('nativacareAdminKey', adminKey); }catch(e){} }
    function adminHeaders(){ return adminKey ? {'X-Admin-Key': adminKey} : {}; }

    function setStatusDot(state){
        const dot = document.getElementById('payStatusDot');
        dot.className = 'w-2 h-2 rounded-full ' + (state === 'ok' ? 'bg-secondary' : state === 'error' ? 'bg-error' : 'bg-outline-variant');
    }

    function statusBadge(status){
        const map = {
            pending_proof: ['Awaiting patient', 'bg-surface-container-high text-on-surface-variant'],
            submitted:     ['Awaiting review', 'bg-gold-muted/30 text-on-surface'],
            approved:      ['Approved', 'bg-secondary-container text-on-secondary-container'],
            rejected:      ['Rejected', 'bg-error-container text-error'],
        };
        const [label, cls] = map[status] || [status, 'bg-surface-container text-on-surface-variant'];
        return `<span class="text-[11px] font-bold px-2.5 py-1 rounded-full ${cls}">${label}</span>`;
    }

    function fileUrl(path){
        if(!path) return '';
        return path.startsWith('http') ? path : (apiBaseUrl.replace(/\/$/, '') + path);
    }

    function formatDateTime(raw){
        if(!raw) return '—';
        // Backend stores these as plain UTC strings like "2026-09-05 03:15:00"
        // (no timezone marker) — treat as UTC explicitly, then show in
        // whichever timezone the person viewing the dashboard is actually in.
        const iso = raw.replace(' ', 'T') + (raw.endsWith('Z') ? '' : 'Z');
        const d = new Date(iso);
        if(isNaN(d.getTime())) return raw;
        return d.toLocaleString(undefined, {
            month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
        });
    }

    function invoiceCard(inv){
        const lead = inv.lead || {};
        const proofs = inv.proofs || [];
        const latestProof = proofs[0];
        const isImage = latestProof && /\.(png|jpe?g|webp|heic)$/i.test(latestProof.file_path || '');
        const canDecide = inv.status === 'submitted';

        return `
        <div class="bg-white rounded-[20px] border border-surface-border shadow-sm overflow-hidden flex flex-col">
            <div class="p-4 flex items-start justify-between gap-2 border-b border-surface-border">
                <div>
                    <p class="font-label-md font-bold text-on-surface">${lead.patient_name || inv.patient_name || 'Unknown patient'}</p>
                    <p class="text-label-sm text-on-surface-variant mt-0.5">${lead.service_name || '—'}</p>
                </div>
                ${statusBadge(inv.status)}
            </div>
            <div class="p-4 space-y-2 flex-1">
                <div class="flex justify-between text-label-sm"><span class="text-on-surface-variant">Amount</span><span class="font-bold">AED ${inv.amount_aed || '—'}</span></div>
                <div class="flex justify-between text-label-sm"><span class="text-on-surface-variant">Reference</span><span class="font-mono">${inv.reference}</span></div>
                <div class="flex justify-between text-label-sm"><span class="text-on-surface-variant">Channel</span><span>${inv.channel}${inv.contact ? ' · ' + inv.contact : ''}</span></div>
                <div class="flex justify-between text-label-sm"><span class="text-on-surface-variant">Requested</span><span>${formatDateTime(inv.created_at)}</span></div>
                ${latestProof ? `<div class="flex justify-between text-label-sm"><span class="text-on-surface-variant">Screenshot sent</span><span>${formatDateTime(latestProof.created_at)}</span></div>` : ''}
                ${inv.status === 'rejected' && inv.reject_reason ? `<div class="text-label-sm text-error mt-1">Reason: ${inv.reject_reason}</div>` : ''}
            </div>
            ${latestProof ? `
            <div class="px-4 pb-3">
                ${isImage
                    ? `<img src="${fileUrl(latestProof.file_path)}" class="w-full h-36 object-cover rounded-lg border border-surface-border cursor-pointer" onclick="openLightbox('${fileUrl(latestProof.file_path)}')">`
                    : `<a href="${fileUrl(latestProof.file_path)}" target="_blank" class="text-primary text-label-sm underline">View uploaded proof</a>`}
            </div>` : `<div class="px-4 pb-3 text-label-sm text-on-surface-variant italic">No screenshot uploaded yet.</div>`}
            ${canDecide ? `
            <div class="p-4 pt-0 flex gap-2">
                <button class="flex-1 bg-primary text-white py-2 rounded-xl text-label-sm font-bold hover:opacity-90 transition-all" onclick="approveInvoice(${inv.id})">Approve</button>
                <button class="flex-1 bg-error-container text-error py-2 rounded-xl text-label-sm font-bold hover:opacity-90 transition-all" onclick="rejectInvoice(${inv.id})">Reject</button>
            </div>` : ''}
        </div>`;
    }

    function renderInvoices(){
        const list = document.getElementById('invoiceList');
        if(!apiBaseUrl){
            list.innerHTML = '<p class="text-label-sm text-on-surface-variant">Connect a backend to load invoices.</p>';
            return;
        }
        const filtered = activeFilter ? invoices.filter(i => i.status === activeFilter) : invoices;
        if(!filtered.length){
            list.innerHTML = '<p class="text-label-sm text-on-surface-variant">No invoices in this view.</p>';
            return;
        }
        list.innerHTML = filtered.map(invoiceCard).join('');

        const pending = invoices.filter(i => i.status === 'submitted').length;
        const badge = document.getElementById('sidebarPendingCount');
        const dot = document.getElementById('pendingBadgeDot');
        if(pending > 0){
            badge.textContent = pending; badge.style.display = 'inline-block';
            dot.style.display = 'block';
        } else {
            badge.style.display = 'none'; dot.style.display = 'none';
        }
    }

    async function fetchInvoices(){
        if(!apiBaseUrl){ setStatusDot('idle'); renderInvoices(); return; }
        const base = apiBaseUrl.replace(/\/$/, '');
        try{
            const res = await fetch(base + '/invoices', {headers: adminHeaders()});
            if(!res.ok) throw new Error('bad status');
            const data = await res.json();
            // Fetch proofs per invoice that has any (only needed for display)
            invoices = data.invoices || [];
            await Promise.all(invoices.map(async inv => {
                try{
                    const d = await fetch(base + '/invoices/' + inv.id, {headers: adminHeaders()}).then(r => r.json());
                    inv.proofs = d.invoice.proofs || [];
                }catch(e){ inv.proofs = []; }
            }));
            setStatusDot('ok');
            document.getElementById('paySubtitle').textContent =
                invoices.length + ' invoice' + (invoices.length === 1 ? '' : 's') + ' total.';
        }catch(e){
            setStatusDot('error');
            invoices = [];
            document.getElementById('paySubtitle').textContent = 'Could not reach ' + apiBaseUrl + '.';
        }
        renderInvoices();
    }

    async function approveInvoice(id){
        if(!confirm('Approve this payment and create the appointment?')) return;
        try{
            const res = await fetch(apiBaseUrl.replace(/\/$/, '') + '/invoices/' + id + '/approve', {method:'POST', headers: adminHeaders()});
            const data = await res.json();
            if(data.status !== 'approved' && data.status !== 'already_approved'){
                alert('Approval failed: ' + JSON.stringify(data));
            }
            await fetchInvoices();
        }catch(e){ alert('Could not reach backend.'); }
    }

    async function rejectInvoice(id){
        const reason = prompt('Reason for rejecting (shown to the patient, optional):', '') || '';
        try{
            await fetch(apiBaseUrl.replace(/\/$/, '') + '/invoices/' + id + '/reject', {
                method:'POST', headers:{'Content-Type':'application/json', ...adminHeaders()},
                body: JSON.stringify({reason}),
            });
            await fetchInvoices();
        }catch(e){ alert('Could not reach backend.'); }
    }

    function openLightbox(url){
        document.getElementById('lightboxImg').src = url;
        document.getElementById('lightbox').classList.remove('hidden');
        document.getElementById('lightbox').classList.add('flex');
    }
    function closeLightbox(){
        document.getElementById('lightbox').classList.add('hidden');
        document.getElementById('lightbox').classList.remove('flex');
    }

    document.querySelectorAll('.filter-tab').forEach(btn => {
        btn.addEventListener('click', () => {
            activeFilter = btn.dataset.status;
            document.querySelectorAll('.filter-tab').forEach(b => {
                b.classList.remove('bg-secondary-container', 'text-on-secondary-container');
                b.classList.add('text-on-surface-variant');
            });
            btn.classList.add('bg-secondary-container', 'text-on-secondary-container');
            btn.classList.remove('text-on-surface-variant');
            renderInvoices();
        });
    });

    document.getElementById('connectBtn').addEventListener('click', async () => {
        apiBaseUrl = document.getElementById('apiUrlInput').value.trim();
        adminKey = document.getElementById('adminKeyInput').value.trim();
        await saveApiUrl();
        await saveAdminKey();
        await fetchInvoices();
    });
    document.getElementById('refreshBtn').addEventListener('click', fetchInvoices);
    document.getElementById('logoutBtn').addEventListener('click', () => {
        apiBaseUrl = ''; adminKey = '';
        try{ localStorage.removeItem('nativacareApiBaseUrl'); localStorage.removeItem('nativacareAdminKey'); }catch(e){}
        document.getElementById('apiUrlInput').value = '';
        document.getElementById('adminKeyInput').value = '';
        invoices = [];
        setStatusDot('idle'); renderInvoices();
    });

    (async function init(){
        await loadState();
        if(apiBaseUrl){ await fetchInvoices(); } else { setStatusDot('idle'); renderInvoices(); }
        setInterval(() => { if(apiBaseUrl) fetchInvoices(); }, 30000);
    })();
</script>
</body></html>
